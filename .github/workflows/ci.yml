name: ci
on: [push, pull_request]
jobs:
  # Guards the v0.8 pip-core promise: the importable core installs and runs with ZERO
  # web/GitHub/MCP dependencies. If `import fidelity_ladder` ever pulls a web lib, this fails.
  core-web-free:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e .   # core only — NO [harness]/[mcp] extras
      - name: core has zero web deps
        run: |
          python -c "import fidelity_ladder, sys; bad=[m for m in ('fastapi','httpx','uvicorn','fastmcp','starlette') if m in sys.modules]; assert not bad, 'core pulled web deps '+repr(bad); print('core web-free OK', fidelity_ladder.__version__)"
  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # the test suite exercises the harness (app.py) + github surface + ladder-mcp, so it needs
      # those extras — the pip-core split moved fastapi/httpx/fastmcp out of the core deps (v0.8).
      - run: pip install -e ".[dev,harness,mcp]"
      - run: ruff check src
      - run: pytest -q
