# Expedition state labels — applied to issues by the harness. Load via `gh label` in P0.
# rung:* = current fidelity rung · dial:* = current autonomy dial · docked = admission refused.

- name: "rung:0-intent"
  color: "ededed"
  description: "Intent stated; awaiting admission"
- name: "rung:1-spec"
  color: "c5def5"
  description: "Spec fan-out + reflection + judge rank"
- name: "rung:2-wireframe"
  color: "bfd4f2"
  description: "Wireframe pick-of-3"
- name: "rung:3-demo"
  color: "9ec5f0"
  description: "Interactive throwaway demo (preview URL)"
- name: "rung:4-mvp"
  color: "5b9bd5"
  description: "MVP in isolated worktree; gated entry + exit"
- name: "rung:5-flagged"
  color: "1f6feb"
  description: "Draft PR behind a feature flag; hard human gate"

- name: "dial:propose-only"
  color: "fbca04"
  description: "Autonomy: agent proposes, human decides"
- name: "dial:human-picks"
  color: "f9d949"
  description: "Autonomy: fan-out, human picks"
- name: "dial:auto-advance"
  color: "b7e778"
  description: "Autonomy: auto-advance with audit (earned)"
- name: "dial:autonomous"
  color: "0e8a16"
  description: "Autonomy: fully autonomous at this rung (earned)"

- name: "docked"
  color: "d93f0b"
  description: "Admission refused — does not trace to ANCHOR (reason in thread)"
- name: "descended"
  color: "e99695"
  description: "Fell back a rung with a lesson attached"
- name: "parked-budget"
  color: "cccccc"
  description: "Hit the per-expedition budget ceiling; awaiting human"
