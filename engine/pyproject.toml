[project]
name = "fidelity-ladder"
version = "0.9.0"
description = "The Fidelity Ladder — progressive-fidelity governance for agentic work (importable core). Rungs-as-data + one-ANCHOR policy + tighten-only cascade + calibration ledger + earned autonomy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["agents", "ai", "governance", "fidelity", "progressive-fidelity", "ladder", "spec-driven"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# CORE is deliberately web/GitHub/MCP-free (grep-gated). The runtime you import (`fidelity_ladder`)
# needs only pydantic + pyyaml. The FastAPI harness, GitHub surface, and ladder-mcp are EXTRAS —
# `pip install fidelity-ladder[harness]` / `[mcp]`. This split IS the framework claim: the pattern
# outlives any one stack (Chase's "runtime you import", not "app with module slots").
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[project.scripts]
fls-bench = "fls.bench:main"   # the scoreboard CLI (zero-spend oracle run by default)

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]
harness = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "httpx>=0.27"]   # the reference FastAPI harness + GitHub surface
mcp = ["fastmcp>=2.0"]   # P5 — ladder-mcp

[project.urls]
Homepage = "https://github.com/nhunsaker/fidelity-ladder-system"
Repository = "https://github.com/nhunsaker/fidelity-ladder-system"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fidelity_ladder", "src/fls"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]   # long lines tolerated in prose-y prompts/anchor strings
